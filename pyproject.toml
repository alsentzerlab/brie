[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brie"
version = "0.1.0"
description = "Tools for longitudinal clinical QA dataset generation, inference, and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic==0.104.1",
  "fsspec==2026.2.0",
  "gcsfs==2026.2.0",
  "google-genai==2.6.0",
  "numpy==2.2.6",
  "openai==2.38.0",
  "pandas==2.3.3",
  "pyyaml==6.0.3",
  "rank-bm25==0.2.2",
  "scikit-learn==1.7.2",
  "tiktoken==0.13.0",
  "tqdm==4.67.3",
]

[project.optional-dependencies]
retrieval = [
  "pylate==1.5.0",
  "sentence-transformers==5.3.0",
  "torch==2.9.0",
]
metrics = [
  "bert-score==0.3.13",
  "matplotlib==3.10.9",
  "nltk==3.9.1",
  "rouge-score==0.1.2",
]
dev = ["pytest==8.4.2", "ruff==0.13.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubric Entailment Annotation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --border: #d0d0d0;
    --muted: #777;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --agree: #16a34a;
    --disagree: #dc2626;
    --met: #dcfce7;
    --met-text: #15803d;
    --notmet: #fee2e2;
    --notmet-text: #b91c1c;
    --radius: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: #111; font-size: 14px; line-height: 1.5; }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; }
  #main { flex: 1; overflow-y: auto; padding: 20px; }

  /* ── Sidebar ── */
  #sidebar-header { padding: 14px 12px 10px; border-bottom: 1px solid var(--border); }
  #sidebar-header h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
  #progress-bar-wrap { margin-top: 6px; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
  #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  #progress-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #nav-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .nav-item { display: flex; align-items: center; gap: 6px; padding: 5px 12px; cursor: pointer;
    font-size: 13px; border-left: 3px solid transparent; color: var(--muted); }
  .nav-item:hover { background: #f0f4ff; }
  .nav-item.active { border-left-color: var(--accent); color: #111; background: var(--accent-light); }
  .nav-item.done { color: #111; }
  .nav-check { font-size: 11px; color: var(--agree); font-weight: 700; margin-left: auto; }
  #sidebar-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }

  /* ── Cards ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 8px; }

  /* ── Question ── */
  #q-text { font-size: 15px; font-weight: 600; line-height: 1.4; }
  #q-meta { font-size: 11px; color: #999; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .q-meta-chip { background: #f0f4ff; color: #2563eb; padding: 1px 7px; border-radius: 99px;
    font-size: 11px; font-weight: 500; }
  .score-chip { padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; }

  /* ── Response ── */
  #response-text { white-space: pre-wrap; font-size: 13px; line-height: 1.6;
    max-height: 240px; overflow-y: auto; }

  /* ── Rubric items ── */
  .rubric-item { border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 10px; }
  .rubric-item:last-child { margin-bottom: 0; }

  .item-header { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    background: #fafafa; border-bottom: 1px solid var(--border); }
  .item-id { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 26px; padding-top: 1px; }
  .item-desc { flex: 1; font-size: 13px; font-weight: 500; line-height: 1.4; }
  .item-verdict { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .verdict-badge { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .badge-met { background: var(--met); color: var(--met-text); }
  .badge-notmet { background: var(--notmet); color: var(--notmet-text); }
  .votes-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .item-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  .item-rationale { font-size: 12px; color: #555; font-style: italic;
    padding: 5px 8px; background: #fafafa; border-left: 3px solid #e2e8f0;
    border-radius: 0 4px 4px 0; }

  .judge-scores { display: flex; flex-direction: column; gap: 4px; }
  .judge-row { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
  .judge-name { font-weight: 600; min-width: 52px; color: #444; }
  .judge-met { color: var(--met-text); font-weight: 700; font-size: 11px;
    background: var(--met); padding: 0 5px; border-radius: 3px; }
  .judge-notmet { color: var(--notmet-text); font-weight: 700; font-size: 11px;
    background: var(--notmet); padding: 0 5px; border-radius: 3px; }
  .judge-missing { color: #aaa; font-style: italic; font-size: 11px; }
  .judge-expl { color: #555; line-height: 1.4; }

  .agree-row { display: flex; align-items: center; gap: 16px; padding-top: 4px;
    border-top: 1px solid #f0f0f0; }
  .agree-label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }
  .agree-label input { cursor: pointer; accent-color: var(--agree); }
  .disagree-label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; color: var(--disagree); }
  .disagree-label input { cursor: pointer; accent-color: var(--disagree); }

  .override-panel { margin-top: 6px; padding: 8px 10px; background: #fff5f5;
    border: 1px solid #fca5a5; border-radius: var(--radius); display: none; }
  .override-panel.visible { display: block; }
  .override-panel > label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--disagree); }
  .override-choices { display: flex; gap: 12px; margin-bottom: 8px; }
  .override-choice { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }
  .override-choice input { cursor: pointer; }
  .override-reason { width: 100%; padding: 6px 8px; border: 1px solid #fca5a5; border-radius: 6px;
    font-size: 12px; font-family: inherit; resize: vertical; min-height: 54px; }
  .override-reason:focus { outline: none; border-color: var(--disagree); }
  .override-reason::placeholder { color: #bbb; }

  /* ── Nav bar ── */
  #nav-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  #nav-bar h1 { font-size: 16px; font-weight: 700; margin-right: auto; }
  .btn { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--card); color: #111;
    transition: background .15s; }
  .btn:hover { background: #f0f0f0; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-success { background: var(--agree); color: #fff; border-color: var(--agree); }
  .btn-success:hover { background: #15803d; }

  /* ── Load screen ── */
  #load-screen { display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--bg); }
  #load-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px 40px; max-width: 520px; width: 100%; box-shadow: var(--shadow); }
  #load-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  #load-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .file-group { margin-bottom: 14px; }
  .file-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #333; }
  #load-error { color: var(--disagree); font-size: 12px; margin-top: 8px; }

  /* ── Score color ── */
  .score-high { background: var(--met); color: var(--met-text); }
  .score-mid  { background: #fef9c3; color: #854d0e; }
  .score-low  { background: var(--notmet); color: var(--notmet-text); }

  #skip-notice { font-size: 12px; color: var(--muted); margin-left: 4px; }
</style>
</head>
<body>

<!-- Load screen -->
<div id="load-screen">
  <div id="load-card">
    <h1>Rubric Entailment Annotation</h1>
    <p>Load an enriched sample JSON file generated by <code>sample_rubric_items.py</code>.</p>
    <div class="file-group">
      <label>Sample JSON</label>
      <input type="file" id="file-json" accept=".json">
    </div>
    <div id="load-error"></div>
    <br>
    <button class="btn btn-primary" onclick="loadFile()">Load &amp; Start</button>
  </div>
</div>

<!-- Main app -->
<div id="app" style="display:none">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Progress</h2>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <div id="progress-label">0 / 0 reviewed</div>
    </div>
    <div id="nav-list"></div>
    <div id="sidebar-footer">
      <button class="btn btn-success" onclick="exportAnnotations()">Export JSON</button>
    </div>
  </div>

  <div id="main">
    <div id="nav-bar">
      <h1>Rubric Entailment Annotation</h1>
      <span id="skip-notice"></span>
      <button class="btn" id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button class="btn" id="btn-skip" onclick="skipCard()">Skip</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveAndNext()">Save &amp; Next →</button>
    </div>

    <!-- Question -->
    <div class="card">
      <div class="card-title">Question</div>
      <div id="q-text"></div>
      <div id="q-meta"></div>
    </div>

    <!-- Candidate response -->
    <div class="card">
      <div class="card-title">Candidate Response</div>
      <div id="response-text"></div>
    </div>

    <!-- Rubric items -->
    <div class="card">
      <div class="card-title">Rubric Items</div>
      <div id="items-container"></div>
    </div>
  </div>
</div>

<script>
// ── Pre-embedded data ─────────────────────────────────────────────────────────
const PRELOADED_DATA = [];

// ── State ─────────────────────────────────────────────────────────────────────
let records     = [];
let annotations = {};
let completed   = new Set();
let current     = 0;
let storageKey  = "";

// ── localStorage persistence ──────────────────────────────────────────────────
function _storageKey(data) {
  return "rubric_ann__" + data.length + "__" + (data[0]?.question_id ?? "");
}

function persistState() {
  if (!storageKey) return;
  try {
    localStorage.setItem(storageKey, JSON.stringify({
      annotations,
      completed: [...completed],
      current,
    }));
  } catch(e) { /* storage full */ }
}

function restoreState(data) {
  const key = _storageKey(data);
  const raw = localStorage.getItem(key);
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    annotations = saved.annotations || {};
    completed   = new Set(saved.completed || []);
    current     = saved.current || 0;
    return true;
  } catch(e) { return false; }
}

function clearStorage() {
  if (storageKey) localStorage.removeItem(storageKey);
  annotations = {};
  completed   = new Set();
  current     = 0;
  document.querySelectorAll(".nav-check").forEach(el => el.textContent = "");
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("done"));
  updateProgress();
  renderCard(0);
}

// ── Rubric dimension definitions (from SCORING_PROMPT) ────────────────────────
const RUBRIC_DEF = "An item is \"met\" if the candidate response contains enough information to satisfy the criterion, even if phrased differently from the rubric wording. An item is \"not met\" if the information is absent, vague, or incorrect.";

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  if (PRELOADED_DATA && PRELOADED_DATA.length > 0) startApp(PRELOADED_DATA);
});

window.addEventListener("beforeunload", e => {
  if (completed.size > 0) {
    e.preventDefault();
    e.returnValue = "You have completed annotations. Export before leaving.";
  }
});

document.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight" || e.key === "l") saveAndNext();
  if (e.key === "ArrowLeft"  || e.key === "h") navigate(-1);
});

// ── File loading ──────────────────────────────────────────────────────────────
function loadFile() {
  const f = document.getElementById("file-json").files[0];
  const errEl = document.getElementById("load-error");
  errEl.textContent = "";
  if (!f) { errEl.textContent = "Please select a sample JSON file."; return; }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data) || !data.length) throw new Error("JSON must be a non-empty array.");
      setTimeout(() => startApp(data), 100);
    } catch(err) { errEl.textContent = "Error: " + err.message; }
  };
  reader.readAsText(f);
}

// ── App start ─────────────────────────────────────────────────────────────────
function startApp(data) {
  records = data;
  storageKey = _storageKey(data);
  const restored = restoreState(data);

  document.getElementById("load-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  buildNavList();

  if (restored && completed.size > 0) {
    showRestoreBanner();
    completed.forEach(i => {
      const c = document.getElementById("check-" + i);
      if (c) c.textContent = "✓";
      const n = document.getElementById("nav-" + i);
      if (n) n.classList.add("done");
    });
  }

  renderCard(current);
}

function showRestoreBanner() {
  if (document.getElementById("restore-banner")) return;
  const bar = document.createElement("div");
  bar.id = "restore-banner";
  bar.style.cssText = "background:#1e40af;color:#fff;font-size:13px;padding:8px 16px;display:flex;align-items:center;gap:12px;";
  bar.innerHTML = `<span>↩ Session restored — ${completed.size} card(s) previously completed.</span>
    <button onclick="clearStorage()" style="margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px;">Reset</button>
    <button onclick="this.parentElement.remove()" style="background:transparent;border:none;color:#fff;cursor:pointer;font-size:16px;line-height:1;">×</button>`;
  document.getElementById("main").prepend(bar);
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function buildNavList() {
  const list = document.getElementById("nav-list");
  list.innerHTML = "";
  records.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "nav-item";
    div.id = "nav-" + i;
    div.onclick = () => { saveCurrentState(); renderCard(i); };
    div.innerHTML = `<span style="min-width:18px;font-size:11px;color:var(--muted)">${i+1}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${truncate(r.question || r.question_id, 22)}</span>
      <span class="nav-check" id="check-${i}"></span>`;
    list.appendChild(div);
  });
  updateProgress();
}

// ── Render card ───────────────────────────────────────────────────────────────
function renderCard(idx) {
  current = idx;
  const r = records[idx];

  // Question
  document.getElementById("q-text").textContent = r.question || r.question_id;

  const score = r.avg_rubric_score != null ? r.avg_rubric_score : null;
  const scoreClass = score == null ? "" : score >= 0.67 ? "score-high" : score >= 0.34 ? "score-mid" : "score-low";
  const scoreStr = score != null ? (score * 100).toFixed(0) + "%" : "—";
  document.getElementById("q-meta").innerHTML = `
    <span class="q-meta-chip">${escHtml(r.source_name || "—")}</span>
    <span class="q-meta-chip" style="background:#f0fdf4;color:#15803d">${escHtml(r.model || "—")}</span>
    <span class="score-chip ${scoreClass}">LLM score: ${scoreStr}</span>
    <span style="color:#aaa">Q ${escHtml(String(r.question_id))}</span>
  `;

  // Response
  document.getElementById("response-text").textContent = r.response || "(no response)";

  // Rubric items
  const container = document.getElementById("items-container");
  container.innerHTML = "";

  const saved = annotations[recordKey(r)];

  (r.rubric_items || []).forEach((item, ii) => {
    const consensusMet = item.consensus_met;
    const votes = item.consensus_votes;
    const totalJudges = Object.keys(item.judges || {}).length || 3;
    const savedItem = saved ? saved.items.find(s => s.id === item.id) : null;
    const defaultAgrees = savedItem ? savedItem.agrees : true;
    const savedOverride = savedItem ? (savedItem.override_met != null ? (savedItem.override_met ? "met" : "notmet") : "") : "";
    const savedReason = savedItem ? (savedItem.reason || "") : "";

    const el = document.createElement("div");
    el.className = "rubric-item";

    // Judge rows HTML
    const judges = item.judges || {};
    const judgeNames = ["gemini", "claude", "gpt"];
    const judgeRowsHtml = judgeNames.map(j => {
      const jd = judges[j];
      if (!jd) return `<div class="judge-row"><span class="judge-name">${capitalize(j)}</span><span class="judge-missing">—</span></div>`;
      const tag = jd.met
        ? `<span class="judge-met">MET</span>`
        : `<span class="judge-notmet">NOT MET</span>`;
      return `<div class="judge-row"><span class="judge-name">${capitalize(j)}</span>${tag}<span class="judge-expl">${escHtml(jd.explanation || "")}</span></div>`;
    }).join("");

    const verdictClass = consensusMet ? "badge-met" : "badge-notmet";
    const verdictLabel = consensusMet ? "MET" : "NOT MET";

    el.innerHTML = `
      <div class="item-header">
        <span class="item-id">${escHtml(item.id)}</span>
        <span class="item-desc" title="${escHtml(RUBRIC_DEF)}">${escHtml(item.description)}</span>
        <div class="item-verdict">
          <span class="verdict-badge ${verdictClass}">${verdictLabel}</span>
          <span class="votes-label">${votes}/${totalJudges}</span>
        </div>
      </div>
      <div class="item-body">
        ${item.rationale ? `<div class="item-rationale">${escHtml(item.rationale)}</div>` : ""}
        <div class="judge-scores">${judgeRowsHtml}</div>
        <div class="agree-row">
          <label class="agree-label">
            <input type="radio" name="agree-${idx}-${ii}" value="agree" ${defaultAgrees ? "checked" : ""}
              onchange="toggleOverride('override-${idx}-${ii}', false)"> Agree
          </label>
          <label class="disagree-label">
            <input type="radio" name="agree-${idx}-${ii}" value="disagree" ${!defaultAgrees ? "checked" : ""}
              onchange="toggleOverride('override-${idx}-${ii}', true)"> Disagree
          </label>
        </div>
        <div class="override-panel ${!defaultAgrees ? "visible" : ""}" id="override-${idx}-${ii}">
          <label>My judgment:</label>
          <div class="override-choices">
            <label class="override-choice">
              <input type="radio" name="ov-${idx}-${ii}" value="met" ${savedOverride === "met" ? "checked" : ""}> Met
            </label>
            <label class="override-choice">
              <input type="radio" name="ov-${idx}-${ii}" value="notmet" ${savedOverride === "notmet" ? "checked" : ""}> Not met
            </label>
          </div>
          <textarea class="override-reason" id="reason-${idx}-${ii}"
            placeholder="Explain why the LLM judgment is wrong…">${escHtml(savedReason)}</textarea>
        </div>
      </div>
    `;
    container.appendChild(el);
  });

  // Nav active
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  const navItem = document.getElementById("nav-" + idx);
  if (navItem) { navItem.classList.add("active"); navItem.scrollIntoView({ block: "nearest" }); }

  updateProgress();
}

function toggleOverride(id, show) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("visible", show);
}

// ── Save / navigate ───────────────────────────────────────────────────────────
function recordKey(r) {
  return `${r.question_id}__${r.source_name}`;
}

function saveCurrentState() {
  if (!records.length) return;
  const r = records[current];
  const items = (r.rubric_items || []).map((item, ii) => {
    const agrees = document.querySelector(`input[name="agree-${current}-${ii}"]:checked`)?.value === "agree";
    const ovVal  = document.querySelector(`input[name="ov-${current}-${ii}"]:checked`)?.value;
    const override_met = agrees ? null : (ovVal === "met" ? true : ovVal === "notmet" ? false : null);
    const reason = agrees ? null : (document.getElementById(`reason-${current}-${ii}`)?.value.trim() || null);
    return { id: item.id, llm_consensus_met: item.consensus_met, agrees, override_met, reason };
  });
  annotations[recordKey(r)] = {
    question_id: r.question_id,
    source_name: r.source_name,
    model: r.model,
    llm_avg_rubric_score: r.avg_rubric_score,
    items,
  };
}

function markComplete(idx) {
  completed.add(idx);
  const checkEl = document.getElementById("check-" + idx);
  if (checkEl) checkEl.textContent = "✓";
  const navItem = document.getElementById("nav-" + idx);
  if (navItem) navItem.classList.add("done");
}

function saveAndNext() {
  saveCurrentState();
  markComplete(current);
  persistState();
  if (current < records.length - 1) renderCard(current + 1);
  else document.getElementById("skip-notice").textContent = "All cards reviewed!";
  updateProgress();
}

function skipCard() {
  if (current < records.length - 1) renderCard(current + 1);
}

function navigate(delta) {
  saveCurrentState();
  persistState();
  const next = current + delta;
  if (next >= 0 && next < records.length) renderCard(next);
  updateProgress();
}

function updateProgress() {
  const n = records.length;
  const done = completed.size;
  document.getElementById("progress-label").textContent = `${done} / ${n} reviewed`;
  document.getElementById("progress-bar").style.width = n > 0 ? (done / n * 100) + "%" : "0%";
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportAnnotations() {
  saveCurrentState();
  const out = [...completed].sort((a, b) => a - b)
    .map(i => annotations[recordKey(records[i])])
    .filter(Boolean);
  if (!out.length) { alert("No completed annotations to export yet."); return; }
  const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `rubric_annotations_${ts}.json`; a.click();
  URL.revokeObjectURL(url);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function truncate(s, n) { if (!s) return "—"; return s.length > n ? s.slice(0, n) + "…" : s; }
</script>
